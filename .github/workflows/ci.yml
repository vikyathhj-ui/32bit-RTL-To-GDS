# CI for rv32-alu-ppa-explorer (docs/BRIEF.md Phase 3): lint, golden model,
# reduced cocotb regression and the formal CI subset. The full flow (LibreLane)
# and the full 1e6-vector regression are not run here; they run locally via
# `make verify` inside the iic-osic container (results committed in results/).
#
# Tools: YosysHQ OSS CAD Suite (Yosys + yosys-slang, SymbiYosys, yices,
# Verilator, Icarus), pinned to a dated release. Versions differ from the
# iic-osic image used locally; see DECISIONS D-020. Spike is not available
# here, so model/test_spike_xcheck.py skips with its reason.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df  # v4
        with:
          version: "2026-10-14"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python packages
        run: python -m pip install cocotb==2.0.1 cocotb-coverage==2.0 pytest

      - name: Tool versions
        run: |
          python --version
          verilator --version
          iverilog -V 2>&1 | head -n1
          yosys -V
          sby --version
          yosys -p "help read_slang" 2>&1 | grep -m1 -i slang

      - name: Golden model tests
        run: make PY=python model-test

      - name: Opcode / adder-code consistency
        run: make PY=python opcodes-check

      - name: Lint (verilator -Wall, all configurations)
        run: make PY=python lint

      - name: Simulation (reduced vector count)
        run: make PY=python sim-ci

      - name: Formal (CI subset)
        run: make PY=python formal-ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ci-results
          path: results/
